      - name: Show final dependency versions
        run: |
          set -eux
          echo "Python: $(python --version)"
          echo "Meson: $(meson --version)"
          echo "Blueprint: $(blueprint-compiler --version)"
          for pc in glib-2.0 gtk4 libadwaita-1 pango cairo cairo-ft fontconfig harfbuzz freetype2 \
                    epoxy graphene-1.0 wayland-client xkbcommon gtk4-layer-shell-0 gdk-pixbuf-2.0; do
            v=$(pkg-config --modversion "$pc" 2>/dev/null || echo MISSING)
            printf "  %-22s %s\n" "$pc" "$v"
          done

      - name: Build Ghostty
        run: |
          set -eux
          # Tell ghostty to use the system (== /opt/deps) GTK4 stack
          # rather than its own bundled fontconfig/freetype/harfbuzz/png.
          # We prefer linking the freshly-built stack so the run-time .so
          # set we collect later matches.
          # Set GI_TYPELIB_PATH for blueprint-compiler to find GTK4/libadwaita typelibs
          export GI_TYPELIB_PATH="${PREFIX}/lib/girepository-1.0:/usr/lib/girepository-1.0"
          # Also ensure LD_LIBRARY_PATH includes our built libraries for g-ir-scanner subprocess
          export LD_LIBRARY_PATH="${PREFIX}/lib:${LD_LIBRARY_PATH}"
          # Add system include paths for @cImport to find X11 and other headers
          # Zig's @cImport uses Clang which needs explicit paths
          export CFLAGS="-I${PREFIX}/include -I/usr/include -I/usr/include/x86_64-linux-gnu"
          zig build \
            -Doptimize=ReleaseSafe \
            -Dtarget="${ZIG_TARGET}" \
            -Dcpu=x86_64_v2 \
            -Dapp-runtime=gtk \
            -Dgtk-x11=true \
            -Dgtk-wayland=true \
            -Dpie=true \
            --search-prefix "${PREFIX}"
          ls -la zig-out/bin/

      - name: Inspect main binary
        run: |
          set -eux
          file zig-out/bin/ghostty
          echo "--- ldd ---"
          LD_LIBRARY_PATH="${PREFIX}/lib:${LD_LIBRARY_PATH}" ldd zig-out/bin/ghostty || true
          echo "--- glibc symbols referenced ---"
          objdump -T zig-out/bin/ghostty 2>/dev/null \
            | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_[0-9]/) print $i }' \
            | sort -uV || true

      - name: Verify ghostty binary <= GLIBC_${{ env.MAX_GLIBC }}
        run: |
          set -eux
          MAX_USED=$(
            objdump -T zig-out/bin/ghostty 2>/dev/null \
              | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_[0-9]/) print $i }' \
              | sed 's/^GLIBC_//' \
              | sort -uV \
              | tail -n1
          )
          echo "Highest GLIBC referenced by ghostty: ${MAX_USED:-none}"
          if [ -z "$MAX_USED" ]; then
            echo "WARNING: no GLIBC refs found"
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$MAX_GLIBC" "$MAX_USED" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$MAX_GLIBC" ]; then
            echo "ERROR: ghostty references GLIBC_${MAX_USED} > GLIBC_${MAX_GLIBC}"
            exit 1
          fi
          echo "OK: GLIBC_${MAX_USED} <= GLIBC_${MAX_GLIBC}"

      - name: Bundle dynamic libraries (recursive)
        shell: bash
        run: |
          set -eux
          OUT=dist/ghostty-uos-amd64
          mkdir -p "$OUT/lib"
          cp zig-out/bin/ghostty "$OUT/ghostty"

          is_glibc_lib() {
            case "$1" in
              linux-vdso.so*|ld-linux-*.so*|libc.so*|libm.so*|libdl.so*|\
              libpthread.so*|libresolv.so*|librt.so*|libutil.so*|libnss_*.so*|\
              libcrypt.so*|libanl.so*|libBrokenLocale.so*) return 0 ;;
              *) return 1 ;;
            esac
          }

          declare -A SEEN=()
          QUEUE=("$OUT/ghostty")

          # Make sure ldd resolves through /opt/deps first.
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib/x86_64-linux-gnu:/usr/lib"

          while [ ${#QUEUE[@]} -gt 0 ]; do
            target="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")
            while IFS= read -r line; do
              name=$(echo "$line" | awk '{print $1}')
              path=$(echo "$line" | awk '{
                for (i=1;i<=NF;i++) if ($i=="=>") { print $(i+1); exit }
              }')
              [ -z "$path" ] && continue
              [ "$path" = "not" ] && continue
              if is_glibc_lib "$name"; then
                continue
              fi
              if [ ! -f "$path" ]; then
                continue
              fi
              real=$(readlink -f "$path")
              base=$(basename "$path")
              if [ -n "${SEEN[$base]:-}" ]; then
                continue
              fi
              SEEN[$base]=1
              cp -L "$real" "$OUT/lib/$base"
              chmod u+w "$OUT/lib/$base"
              QUEUE+=("$OUT/lib/$base")
            done < <(ldd "$target" 2>/dev/null || true)
          done

          # Explicitly bundle Mesa DRI drivers (dlopen'd, not caught by ldd)
          echo "--- bundling Mesa DRI drivers ---"
          mkdir -p "$OUT/lib/dri"
          if [ -f "${PREFIX}/lib/dri/llvmpipe_dri.so" ]; then
            cp -L "${PREFIX}/lib/dri/llvmpipe_dri.so" "$OUT/lib/dri/"
            chmod u+w "$OUT/lib/dri/llvmpipe_dri.so"
            echo "Bundled llvmpipe_dri.so"
          fi
          # Also bundle libLLVM if present (Mesa depends on it)
          for lib in "${PREFIX}/lib/libLLVM"*.so*; do
            [ -f "$lib" ] || continue
            base=$(basename "$lib")
            if [ -z "${SEEN[$base]:-}" ]; then
              cp -L "$lib" "$OUT/lib/$base"
              chmod u+w "$OUT/lib/$base"
              SEEN[$base]=1
              echo "Bundled $base"
            fi
          done

          echo "--- bundled libs ---"
          ls -la "$OUT/lib/"
          ls -la "$OUT/lib/dri/" || true

          # Download and bundle fonts (JetBrains Mono + Source Code Pro)
          mkdir -p "$OUT/share/fonts"

          # JetBrains Mono (version 2.304)
          curl -fL "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip" -o /tmp/jbmono.zip
          unzip -j /tmp/jbmono.zip "fonts/ttf/JetBrainsMono-Regular.ttf" "fonts/ttf/JetBrainsMono-Bold.ttf" "fonts/ttf/JetBrainsMono-Italic.ttf" "fonts/ttf/JetBrainsMono-BoldItalic.ttf" -d "$OUT/share/fonts/"

          # Source Code Pro (version 2.042R-u)
          curl -fL "https://github.com/adobe-fonts/source-code-pro/releases/download/2.042R-u/1.062R-i/1.026R-vf/TTF-source-code-pro-2.042R-u_1.062R-i.zip" -o /tmp/scpro.zip
          unzip -j /tmp/scpro.zip "*.ttf" -d "$OUT/share/fonts/"

          rm -f /tmp/jbmono.zip /tmp/scpro.zip

          echo "--- bundled fonts ---"
          ls -la "$OUT/share/fonts/"

          # Create fontconfig configuration with bundled fonts
          mkdir -p "$OUT/etc/fonts/conf.d"
          printf '%s\n' '<?xml version="1.0"?>' \
            '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' \
            '<fontconfig>' \
            '  <!-- Bundled fonts (relative to XDG_DATA_HOME/share/fonts) -->' \
            '  <dir prefix="xdg">fonts</dir>' \
            '  <!-- System fonts -->' \
            '  <dir>/usr/share/fonts</dir>' \
            '  <dir>/usr/local/share/fonts</dir>' \
            '  <dir>~/.fonts</dir>' \
            '  <dir>~/.local/share/fonts</dir>' \
            '  <!-- Font cache -->' \
            '  <cachedir>~/.cache/fontconfig</cachedir>' \
            '  <cachedir>/var/cache/fontconfig</cachedir>' \
            '  <!-- Prefer bundled fonts as default monospace -->' \
            '  <match>' \
            '    <test name="family"><string>monospace</string></test>' \
            '    <edit name="family" mode="prepend" binding="strong">' \
            '      <string>JetBrains Mono</string>' \
            '    </edit>' \
            '  </match>' \
            '</fontconfig>' > "$OUT/etc/fonts/fonts.conf"

          # Create AppRun wrapper that sets environment variables
          mv "$OUT/ghostty" "$OUT/ghostty.bin"
          printf '%s\n' '#!/bin/bash' \
            '# Self-contained Ghostty launcher for UOS20' \
            '# Auto-detect installation directory' \
            'APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"' \
            '' \
            '# Set up bundled resources' \
            'export XDG_DATA_HOME="$APPDIR/share"' \
            'export FONTCONFIG_PATH="$APPDIR/etc/fonts"' \
            'export FONTCONFIG_FILE=fonts.conf' \
            'export LD_LIBRARY_PATH="$APPDIR/lib:$LD_LIBRARY_PATH"' \
            'export GI_TYPELIB_PATH="$APPDIR/lib/girepository-1.0:/usr/lib/girepository-1.0"' \
            '' \
            '# Auto-detect display backend (X11 or Wayland)' \
            '# UOS20 uses X11 by default, but Wayland is also supported' \
            'if [ -n "$WAYLAND_DISPLAY" ] && [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then' \
            '  # Wayland session detected' \
            '  export GDK_BACKEND=wayland' \
            'elif [ -n "$DISPLAY" ]; then' \
            '  # X11 session detected' \
            '  export GDK_BACKEND=x11' \
            'else' \
            '  # No display detected, try Wayland first then fallback to X11' \
            '  if [ -S "$XDG_RUNTIME_DIR/wayland-0" ]; then' \
            '    export GDK_BACKEND=wayland' \
            '    export WAYLAND_DISPLAY=wayland-0' \
            '  elif [ -e /tmp/.X11-unix/X0 ]; then' \
            '    export GDK_BACKEND=x11' \
            '    export DISPLAY=:0' \
            '  else' \
            '    echo "Error: No display server detected"' \
            '    echo "Please run Ghostty in a graphical session (X11 or Wayland)"' \
            '    exit 1' \
            '  fi' \
            'fi' \
            '' \
            '# Force Mesa llvmpipe software rendering (OpenGL 4.5)' \
            '# Required for VMs without GPU 3D acceleration' \
            'export LIBGL_ALWAYS_SOFTWARE=1' \
            'export LIBGL_DRIVERS_PATH="$APPDIR/lib/dri"' \
            'export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe' \
            'export __LLVM_SYNC=1' \
            '' \
            'exec "$APPDIR/ghostty.bin" "$@"' > "$OUT/AppRun"
          chmod +x "$OUT/AppRun"
          ln -sf AppRun "$OUT/ghostty"
          
          # Create desktop file for easy launching
          mkdir -p "$OUT/share/applications"
          printf '%s\n' '[Desktop Entry]' \
            'Version=1.0' \
            'Name=Ghostty' \
            'Comment=Fast, feature-rich terminal emulator for UOS20' \
            'Exec=/opt/ghostty-uos/ghostty-uos-amd64/ghostty' \
            'Icon=/opt/ghostty-uos/ghostty-uos-amd64/share/icons/ghostty.png' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=System;TerminalEmulator;' \
            'StartupNotify=true' \
            'StartupWMClass=ghostty' > "$OUT/share/applications/ghostty.desktop"
          
          # Download Ghostty icon (if available) or create placeholder
          mkdir -p "$OUT/share/icons"
          curl -fL "https://raw.githubusercontent.com/ghostty-org/ghostty/main/assets/icons/icon.png" \
            -o "$OUT/share/icons/ghostty.png" 2>/dev/null || \
          printf '%s\n' '# Note: Icon file not found. You can add an icon manually.' \
            '# Place a PNG icon at: /opt/ghostty-uos/ghostty-uos-amd64/share/icons/ghostty.png' \
            > "$OUT/share/icons/README.txt"
          
          # Create ghostty configuration template
          mkdir -p "$OUT/share/doc"
          printf '%s\n' \
            '# Ghostty configuration template for UOS20' \
            '# Copy this file to ~/.config/ghostty/config to customize settings' \
            '' \
            '# Font settings' \
            '# font-family = "JetBrains Mono"' \
            '# font-family-bold = "JetBrains Mono Bold"' \
            '# font-family-italic = "JetBrains Mono Italic"' \
            '# font-family-bold-italic = "JetBrains Mono Bold Italic"' \
            '# font-size = 12' \
            '' \
            '# Alternative font: Source Code Pro' \
            '# font-family = "Source Code Pro"' \
            '' \
            '# Theme settings' \
            '# theme = "dark"' \
            '# background-opacity = 0.95' \
            '' \
            '# Performance settings' \
            '# scrollback-limit = 10000' \
            '' \
            '# Keybindings (example)' \
            '# keybind = ctrl+shift+c=copy_to_clipboard' \
            '# keybind = ctrl+shift+v=paste_from_clipboard' \
            '' \
            '# More settings: https://ghostty.org/docs/config' \
            '' > "$OUT/share/doc/ghostty.conf.example"
          
          # Create README documentation
          printf '%s\n' \
            '# Ghostty for UOS20 (统信UOS 20)' \
            '' \
            '## 系统要求' \
            '- 统信UOS 20 (基于Debian 10, glibc 2.28)' \
            '- Wayland显示服务器' \
            '' \
            '## 安装步骤' \
            '' \
            '### 方法1: 使用安装脚本（推荐）' \
            '```bash' \
            'sudo ./install.sh' \
            '```' \
            '安装完成后，Ghostty将出现在系统应用菜单中，可以直接点击运行。' \
            '' \
            '### 方法2: 手动安装' \
            '```bash' \
            '# 解压到任意目录' \
            'tar xzf ghostty-uos-amd64.tar.gz' \
            '' \
            '# 运行' \
            './ghostty-uos-amd64/ghostty' \
            '```' \
            '' \
            '## 配置文件' \
            '- 配置模板：`share/doc/ghostty.conf.example`' \
            '- 复制到：`~/.config/ghostty/config`' \
            '- 编辑配置文件以自定义字体、主题、按键绑定等' \
            '' \
            '## 内置字体' \
            '- JetBrains Mono (默认)' \
            '- Source Code Pro' \
            '' \
            '## 运行要求' \
            '- 此版本已打包所有必要的依赖库' \
            '- 仅依赖系统glibc 2.28' \
            '- 可在UOS20上直接运行，无需额外安装依赖' \
            '' \
            '## 故障排除' \
            '- 如果图标未显示，请检查`share/icons/ghostty.png`是否存在' \
            '- 如果字体渲染异常，请检查`share/fonts/`目录下的字体文件' \
            '- 运行`ldd ghostty.bin`检查是否有缺失的依赖库' \
            '' \
            '## 更多信息' \
            '- Ghostty官方文档：https://ghostty.org/docs' \
            '- 配置参考：https://ghostty.org/docs/config' \
            '' > "$OUT/README.md"
          
          # Create installation script
          printf '%s\n' '#!/bin/bash' \
            '# Installation script for Ghostty on UOS20' \
            '# Requires sudo privileges' \
            '' \
            'INSTALL_DIR="/opt/ghostty-uos"' \
            'BUNDLE_NAME="ghostty-uos-amd64"' \
            '' \
            '# Check if running as root' \
            'if [ "$EUID" -ne 0 ]; then' \
            '  echo "Please run with sudo: sudo ./install.sh"' \
            '  exit 1' \
            'fi' \
            '' \
            '# Extract the bundle' \
            'echo "Installing Ghostty to $INSTALL_DIR..."' \
            'mkdir -p "$INSTALL_DIR"' \
            'tar xzf ghostty-uos-amd64.tar.gz -C "$INSTALL_DIR"' \
            '' \
            '# Set permissions' \
            'chmod +x "$INSTALL_DIR/$BUNDLE_NAME/ghostty"' \
            'chmod +x "$INSTALL_DIR/$BUNDLE_NAME/AppRun"' \
            'chmod +x "$INSTALL_DIR/$BUNDLE_NAME/install.sh"' \
            '' \
            '# Install desktop entry' \
            'DESKTOP_FILE="$INSTALL_DIR/$BUNDLE_NAME/share/applications/ghostty.desktop"' \
            'if [ -f "$DESKTOP_FILE" ]; then' \
            '  # Update desktop file paths to absolute installation location' \
            '  sed -i "s|Exec=/opt/ghostty-uos|$INSTALL_DIR|g" "$DESKTOP_FILE"' \
            '  sed -i "s|Icon=/opt/ghostty-uos|$INSTALL_DIR|g" "$DESKTOP_FILE"' \
            '  cp "$DESKTOP_FILE" /usr/share/applications/' \
            '  echo "Desktop entry installed to /usr/share/applications/"' \
            'else' \
            '  echo "Warning: Desktop file not found"' \
            'fi' \
            '' \
            '# Install icon (if exists)' \
            'ICON_FILE="$INSTALL_DIR/$BUNDLE_NAME/share/icons/ghostty.png"' \
            'if [ -f "$ICON_FILE" ]; then' \
            '  mkdir -p /usr/share/icons/hicolor/256x256/apps/' \
            '  cp "$ICON_FILE" /usr/share/icons/hicolor/256x265/apps/ghostty.png' \
            '  gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true' \
            '  echo "Icon installed to system icon theme"' \
            'else' \
            '  echo "Warning: Icon file not found"' \
            'fi' \
            '' \
            'echo ""' \
            'echo "✓ Ghostty installed successfully!"' \
            'echo ""' \
            'echo "Usage:"' \
            'echo "  - From application menu: Search for 'Ghostty' in your app launcher"' \
            'echo "  - From terminal: $INSTALL_DIR/$BUNDLE_NAME/ghostty"' \
            'echo "  - Config template: $INSTALL_DIR/$BUNDLE_NAME/share/doc/ghostty.conf.example"' \
            'echo ""' \
            'echo "To customize settings:"' \
            'echo "  cp $INSTALL_DIR/$BUNDLE_NAME/share/doc/ghostty.conf.example ~/.config/ghostty/config"' \
            'echo "  nano ~/.config/ghostty/config"' \
            '' > "$OUT/install.sh"
          chmod +x "$OUT/install.sh"

          echo "--- bundle structure ---"
          ls -la "$OUT/"
          ls -la "$OUT/etc/fonts/"
          ls -la "$OUT/share/fonts/"

      - name: Patch RPATH on binary and bundled libs
        run: |
          set -eux
          OUT=dist/ghostty-uos-amd64
          # Patch the actual binary (ghostty.bin), not the wrapper script
          patchelf --set-rpath '$ORIGIN/lib' "$OUT/ghostty.bin"
          # Patch DRI drivers (in lib/dri/ subdir, need $ORIGIN/.. to find libs in lib/)
          if [ -d "$OUT/lib/dri" ]; then
            for dri in "$OUT/lib/dri/"*.so; do
              [ -f "$dri" ] || continue
              if file "$dri" | grep -q ELF; then
                patchelf --set-rpath '$ORIGIN/..' "$dri" || true
              fi
            done
          fi
          for so in "$OUT/lib/"*.so*; do
            [ -f "$so" ] || continue
            if file "$so" | grep -q ELF; then
              patchelf --set-rpath '$ORIGIN' "$so" || true
            fi
          done

      - name: Verify final bundle (no missing deps, glibc scan)
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist/ghostty-uos-amd64
          cd "$OUT"

          echo "=== ldd ./ghostty.bin ==="
          ldd ./ghostty.bin

          echo
          echo "=== check 'not found' ==="
          if ldd ./ghostty.bin | grep -F "not found"; then
            echo "ERROR: unresolved deps in ghostty"
            exit 1
          fi
          for so in lib/*.so*; do
            [ -f "$so" ] || continue
            if ldd "$so" 2>/dev/null | grep -F "not found"; then
              echo "ERROR: unresolved deps in $so"
              exit 1
            fi
          done
          echo "OK: no missing deps"

          echo
          echo "=== glibc symbol scan ==="
          MAX="${MAX_GLIBC}"
          OFFENDERS=()
          scan_one() {
            local f="$1"
            local high
            high=$(objdump -T "$f" 2>/dev/null \
              | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_[0-9]/) print $i }' \
              | sed 's/^GLIBC_//' \
              | sort -uV \
              | tail -n1)
            if [ -z "$high" ]; then
              echo "  (no GLIBC refs) $f"
              return 0
            fi
            local top
            top=$(printf '%s\n%s\n' "$MAX" "$high" | sort -V | tail -n1)
            if [ "$top" = "$MAX" ]; then
              echo "  OK   GLIBC_${high}  $f"
            else
              echo "  WARN GLIBC_${high}  $f"
              OFFENDERS+=("$f:GLIBC_${high}")
            fi
          }
          scan_one ./ghostty.bin
          for so in lib/*.so*; do
            [ -f "$so" ] || continue
            scan_one "$so"
          done

          echo
          if [ ${#OFFENDERS[@]} -gt 0 ]; then
            echo "WARNING: ${#OFFENDERS[@]} bundled file(s) over GLIBC_${MAX}:"
            for o in "${OFFENDERS[@]}"; do echo "  - $o"; done
          else
            echo "OK: every file in the bundle stays within GLIBC_${MAX}"
          fi

      - name: Create distribution tarball
        run: |
          set -eux
          cd dist
          tar czf ghostty-uos-amd64.tar.gz ghostty-uos-amd64
          ls -lh ghostty-uos-amd64.tar.gz
          tar tzf ghostty-uos-amd64.tar.gz | head -n 60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-uos-amd64
          path: dist/ghostty-uos-amd64.tar.gz
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "- Build host: \`debian:10\` (glibc 2.28, exact UOS20 match)"
            echo "- Target: \`${ZIG_TARGET}\`, ghostty bin capped at GLIBC_${MAX_GLIBC}"
            echo "- App runtime: GTK4 / Wayland"
            echo
            if [ -f dist/ghostty-uos-amd64.tar.gz ]; then
              size=$(ls -lh dist/ghostty-uos-amd64.tar.gz | awk '{print $5}')
              echo "Tarball: \`ghostty-uos-amd64.tar.gz\` (${size})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
