name: Build for UOS20 (glibc 2.28)

# Strategy:
#   Build inside debian:10 (glibc 2.28), exactly matching UOS20's runtime
#   ABI. Debian 10's system packages predate GTK4 entirely and its glib
#   (2.58) is below GTK4's 2.66 minimum, so we compile the GTK4 stack
#   from source into /opt/deps. The ghostty binary itself uses Zig with
#   -Dtarget=x86_64-linux-gnu.2.28 as a belt-and-braces guarantee that
#   no symbol newer than GLIBC_2.28 is referenced.
#
#   Build phases:
#     1. apt: minimal toolchain (gcc, make, pkg-config, autotools) + the
#        system glib (2.58) which we use as a bootstrap *only* to compile
#        the new glib/cairo/pango subprojects' helpers, then immediately
#        replace with the locally-built newer ones via PKG_CONFIG_PATH.
#     2. python-build-standalone: drop a self-contained Python 3.12 in
#        /opt/python (debian:10's Python 3.7 is too old for current meson
#        and blueprint-compiler 0.16). pip-install meson, ninja,
#        blueprint-compiler from there.
#     3. Zig 0.15.2 via setup-zig action.
#     4. Source-compile dependency stack into /opt/deps:
#        zlib -> libffi -> libxml2 -> gettext (libintl) -> wayland ->
#        wayland-protocols -> libxkbcommon -> pixman -> freetype ->
#        fontconfig (-Dxft=disabled) -> harfbuzz -> cairo (no x11/xft) ->
#        pango (no xft) -> gdk-pixbuf -> libepoxy -> graphene -> gtk4
#        (wayland only, no x11/vulkan/cups/colord) -> libadwaita -> 
#        gtk4-layer-shell.
#     5. zig build: links against the locally-built stack via
#        --search-prefix /opt/deps; the resulting ghostty binary is
#        capped at GLIBC_2.28 by Zig's target flag.
#     6. Recursive ldd walker copies every non-glibc .so next to the
#        binary; patchelf rewrites RPATH to $ORIGIN/lib.
#     7. Verify: no missing deps, ghostty binary <= GLIBC_2.28, list any
#        bundled .so still referencing newer glibc symbols.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  PREFIX: /opt/deps
  PY_PREFIX: /opt/python
  ZIG_TARGET: x86_64-linux-gnu.2.28
  MAX_GLIBC: "2.28"
  # Single source of truth for pkg-config / PATH / LD_LIBRARY_PATH search.
  # All build steps re-export these.
  CFLAGS_BASE: "-fPIC -O2"
  # Versions we pin (bump together when you want a fresh build).
  V_PYTHON: "3.11.10"
  V_ZLIB: "1.3.1"
  V_LIBFFI: "3.4.6"
  V_LIBXML2: "2.12.7"
  V_PCRE2: "10.43"
  V_FRIBIDI: "1.0.13"
  V_LIBXMLB: "0.3.21"
  V_APPSTREAM: "1.0.5"
  V_WAYLAND: "1.22.0"
  V_WAYLAND_PROTOCOLS: "1.36"
  V_XKBCOMMON: "1.6.0"
  V_PIXMAN: "0.42.2"
  V_FREETYPE: "2.13.2"
  V_FONTCONFIG: "2.14.2"
  V_HARFBUZZ: "8.5.0"
  V_CAIRO: "1.18.0"
  V_PANGO: "1.52.2"
  V_GDK_PIXBUF: "2.42.10"
  V_LIBEPOXY: "1.5.10"
  V_GRAPHENE: "1.10.8"
  V_GLIB: "2.78.4"
  V_GTK4: "4.14.4"
  V_LIBADWAITA: "1.5.4"
  V_GTK4_LAYER_SHELL: "1.1.0"
  V_BLUEPRINT: "0.20.4"
  V_MESA: "21.3.8"
  V_LIBDRM: "2.4.120"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:10
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:
      - name: Configure debian:10 archive sources
        # buster has been moved to archive.debian.org; the default
        # deb.debian.org URLs return 404 for buster.
        run: |
          set -eux
          cat >/etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian buster-updates main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          # buster is no longer signed by current keyring; allow it.
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid

      - name: Install host build tools (apt)
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl wget xz-utils tar gzip bzip2 unzip \
            git \
            pkg-config \
            autoconf automake libtool \
            patchelf file binutils \
            xxd \
            bison flex \
            gperf \
            sed gawk \
            python3 \
            clang \
            libexpat1-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libcurl4-openssl-dev \
            libyaml-dev \
            libzstd-dev \
            libonig-dev \
            libbz2-dev \
            gettext \
            autopoint \
            itstool \
            xsltproc \
            docbook-xsl \
            docbook-xml \
            gobject-introspection \
            libgirepository1.0-dev \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 \
            libonig-dev \
            llvm-7-dev \
            gir1.2-graphene-1.0 \
            libx11-dev \
            libxrender-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-util0-dev \
            libxcb-shm0-dev
          rm -rf /var/lib/apt/lists/*
          # Sanity
          ldd --version | head -n1
          gcc --version | head -n1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache /opt/deps and /opt/python
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            /opt/deps
            /opt/python
          # We key on a manual version rather than yml hash so cache survives
          # iterative workflow tweaks. Bump the v* prefix to force a clean
          # rebuild from scratch.
          # Bumped to v11 to force rebuild with X11 support enabled
          key: uos-deps-v12-${{ github.run_id }}
          restore-keys: |
            uos-deps-v12-

      - name: Install standalone Python 3.12 (debian:10's 3.7 is too old)
        run: |
          set -eux
          if [ -x "/opt/python/bin/python3" ]; then echo "skip: python already installed"; exit 0; fi
          mkdir -p "${PY_PREFIX}"
          # python-build-standalone: prebuilt portable cpython.
          # Picked the install_only build which is unpacked at PY_PREFIX/python.
          PBS_TAG="20241016"
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${V_PYTHON}+${PBS_TAG}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          curl -fL "$URL" -o /tmp/py.tgz
          tar -C "${PY_PREFIX}" -xzf /tmp/py.tgz --strip-components=1
          rm /tmp/py.tgz
          "${PY_PREFIX}/bin/python3" --version
          "${PY_PREFIX}/bin/pip3" install --no-cache-dir --upgrade pip
          "${PY_PREFIX}/bin/pip3" install --no-cache-dir \
            "meson==1.5.2" \
            "ninja==1.11.1.1" \
            "blueprint-compiler==${V_BLUEPRINT}" \
            "jinja2" \
            "mako" \
            "packaging"
          ln -sf "${PY_PREFIX}/bin/python3" "${PY_PREFIX}/bin/python"
          # Fix shebang in blueprint-compiler to use our Python
          sed -i '1s|^#!.*|#!/opt/python/bin/python3|' "${PY_PREFIX}/bin/blueprint-compiler"

      - name: Make standalone Python and prefix tools visible
        run: |
          set -eux
          # Re-export to GITHUB_PATH so subsequent steps inherit it.
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"
          echo "${PY_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup environment for source builds
        run: |
          {
            echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=${PREFIX}/lib:/usr/lib/x86_64-linux-gnu:/usr/lib"
            echo "ACLOCAL_PATH=${PREFIX}/share/aclocal:/usr/share/aclocal"
            echo "GI_TYPELIB_PATH=/usr/share/gir-1.0:${PREFIX}/share/gir-1.0"
            echo "INTROSPECTION_GIR_PATH=/usr/share/gir-1.0:${PREFIX}/share/gir-1.0"
            echo "PATH=${PREFIX}/bin:${PY_PREFIX}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          } >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # ----- begin source builds (only when cache miss) -----

      - name: Build zlib
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/zlib.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/zlib.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://github.com/madler/zlib/releases/download/v${V_ZLIB}/zlib-${V_ZLIB}.tar.gz" -o zlib.tgz
          tar xzf zlib.tgz
          cd zlib-${V_ZLIB}
          CFLAGS="${CFLAGS_BASE}" ./configure --prefix="${PREFIX}"
          make -j"$(nproc)"
          make install
          pkg-config --modversion zlib

      - name: Build libffi
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/libffi.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/libffi.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://github.com/libffi/libffi/releases/download/v${V_LIBFFI}/libffi-${V_LIBFFI}.tar.gz" -o libffi.tgz
          tar xzf libffi.tgz
          cd libffi-${V_LIBFFI}
          CFLAGS="${CFLAGS_BASE}" ./configure --prefix="${PREFIX}" --disable-docs
          make -j"$(nproc)"
          make install
          pkg-config --modversion libffi

      - name: Build libxml2 (needed by gettext, fontconfig)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/libxml-2.0.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/libxml-2.0.pc present"; exit 0; fi
          cd /tmp
          # libxml2 release tarball naming: 2.12.7 -> 2.12/libxml2-2.12.7.tar.xz
          MAJORMIN=$(echo "${V_LIBXML2}" | cut -d. -f1,2)
          curl -fL "https://download.gnome.org/sources/libxml2/${MAJORMIN}/libxml2-${V_LIBXML2}.tar.xz" -o libxml2.txz
          tar xJf libxml2.txz
          cd libxml2-${V_LIBXML2}
          CFLAGS="${CFLAGS_BASE}" ./configure \
            --prefix="${PREFIX}" \
            --without-python \
            --without-lzma
          make -j"$(nproc)"
          make install
          pkg-config --modversion libxml-2.0

      # gettext was attempted but glib's nls=disabled means we don't need
      # libintl as a separate library; glibc 2.28 already provides ngettext
      # via libc itself. Skipping gettext saves ~5 minutes.

      - name: Build pcre2 (needed by glib 2.78)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/libpcre2-8.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/libpcre2-8.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${V_PCRE2}/pcre2-${V_PCRE2}.tar.bz2" -o pcre2.tbz
          tar xjf pcre2.tbz
          cd pcre2-${V_PCRE2}
          CFLAGS="${CFLAGS_BASE}" ./configure \
            --prefix="${PREFIX}" \
            --enable-pcre2-8 \
            --enable-pcre2-16 \
            --enable-pcre2-32 \
            --disable-pcre2grep-libz \
            --disable-pcre2grep-libbz2 \
            --enable-shared \
            --enable-static
          make -j"$(nproc)"
          make install
          pkg-config --modversion libpcre2-8

      - name: Build glib (needs libffi, libxml2, zlib, pcre2)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/glib-2.0.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/glib-2.0.pc present"; exit 0; fi
          cd /tmp
          MAJORMIN=$(echo "${V_GLIB}" | cut -d. -f1,2)
          curl -fL "https://download.gnome.org/sources/glib/${MAJORMIN}/glib-${V_GLIB}.tar.xz" -o glib.txz
          tar xJf glib.txz
          cd glib-${V_GLIB}
          rm -f subprojects/*.wrap
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=both \
            --wrap-mode=nofallback \
            -Dtests=false \
            -Dnls=disabled \
            -Dxattr=false \
            -Dman=false \
            -Dgtk_doc=false \
            -Dselinux=disabled \
            -Dlibmount=disabled \
            -Dsysprof=disabled
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion glib-2.0

      - name: Build wayland (libwayland-client, server, scanner)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/wayland-client.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/wayland-client.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://gitlab.freedesktop.org/wayland/wayland/-/releases/${V_WAYLAND}/downloads/wayland-${V_WAYLAND}.tar.xz" -o wayland.txz
          tar xJf wayland.txz
          cd wayland-${V_WAYLAND}
          rm -f subprojects/*.wrap
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=both \
            --wrap-mode=nofallback \
            -Ddocumentation=false \
            -Ddtd_validation=true \
            -Dtests=false
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-scanner

      - name: Build wayland-protocols
        run: |
          set -eux
          if [ -f "/opt/deps/share/pkgconfig/wayland-protocols.pc" ]; then echo "skip: marker /opt/deps/share/pkgconfig/wayland-protocols.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/${V_WAYLAND_PROTOCOLS}/downloads/wayland-protocols-${V_WAYLAND_PROTOCOLS}.tar.xz" -o wayland-protocols.txz \
            || curl -fL "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/archive/${V_WAYLAND_PROTOCOLS}/wayland-protocols-${V_WAYLAND_PROTOCOLS}.tar.gz" -o wayland-protocols.tgz
          if [ -f wayland-protocols.txz ]; then tar xJf wayland-protocols.txz; else tar xzf wayland-protocols.tgz; fi
          cd wayland-protocols-${V_WAYLAND_PROTOCOLS}
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            -Dtests=false
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion wayland-protocols

      - name: Build libxkbcommon (X11 + Wayland)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/xkbcommon.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/xkbcommon.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://xkbcommon.org/download/libxkbcommon-${V_XKBCOMMON}.tar.xz" -o xkb.txz
          tar xJf xkb.txz
          cd libxkbcommon-${V_XKBCOMMON}
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=both \
            --wrap-mode=nofallback \
            -Denable-wayland=true \
            -Denable-x11=true \
            -Denable-docs=false \
            -Denable-xkbregistry=false \
            -Denable-tools=false
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion xkbcommon
          pkg-config --modversion xkbcommon-x11

      - name: Build pixman
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/pixman-1.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/pixman-1.pc present"; exit 0; fi
          cd /tmp
          UA='Mozilla/5.0 (X11; Linux x86_64)'
          download() {
            for i in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 5 -A "$UA" "$1" -o pixman.tgz; then return 0; fi
              echo "retry $i for $1"; sleep 5
            done
            return 1
          }
          download "https://cairographics.org/releases/pixman-${V_PIXMAN}.tar.gz" \
          || download "https://gitlab.freedesktop.org/pixman/pixman/-/archive/pixman-${V_PIXMAN}/pixman-pixman-${V_PIXMAN}.tar.gz" \
          || download "https://www.cairographics.org/releases/pixman-${V_PIXMAN}.tar.gz"
          tar xzf pixman.tgz
          # If we ended up with the gitlab archive, the dir is named differently
          if [ -d "pixman-pixman-${V_PIXMAN}" ] && [ ! -d "pixman-${V_PIXMAN}" ]; then
            mv "pixman-pixman-${V_PIXMAN}" "pixman-${V_PIXMAN}"
          fi
          cd pixman-${V_PIXMAN}
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=both \
            --wrap-mode=nofallback \
            -Dtests=disabled \
            -Dgtk=disabled \
            -Dlibpng=disabled
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion pixman-1

      - name: Build freetype (initial, without harfbuzz)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/freetype2.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/freetype2.pc present"; exit 0; fi
          cd /tmp
          # savannah.gnu.org is unreachable from GitHub runners. Use git clone.
          # freetype git tags use VER-X-Y-Z format (all dots replaced by hyphens)
          FT_TAG=$(echo "${V_FREETYPE}" | sed 's/\./-/g')
          rm -rf freetype-${V_FREETYPE}
          # Need --recursive for subprojects/dlg submodule
          git clone --depth=1 --branch="VER-${FT_TAG}" --recursive \
            https://github.com/freetype/freetype.git \
            freetype-${V_FREETYPE}
          cd freetype-${V_FREETYPE}
          # Git clone doesn't have pre-generated configure, need to run autogen.sh
          ./autogen.sh
          # First build without harfbuzz (cyclic). We'll rebuild after harfbuzz.
          ./configure \
            --prefix="${PREFIX}" \
            --without-harfbuzz \
            --with-png=yes \
            --with-zlib=yes \
            --with-bzip2=no \
            --with-brotli=no \
            CFLAGS="${CFLAGS_BASE}"
          make -j"$(nproc)"
          make install
          pkg-config --modversion freetype2

      - name: Build fontconfig (no xft, no docs)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/fontconfig.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/fontconfig.pc present"; exit 0; fi
          cd /tmp
          # freedesktop.org and gitlab archive URLs both return HTML to GitHub runners.
          # Use git clone with shallow depth to get the specific tag.
          rm -rf fontconfig-${V_FONTCONFIG}
          git clone --depth=1 --branch="${V_FONTCONFIG}" \
            https://gitlab.freedesktop.org/fontconfig/fontconfig.git \
            fontconfig-${V_FONTCONFIG}
          cd fontconfig-${V_FONTCONFIG}
          # Bootstrap autotools
          NOCONFIGURE=1 ./autogen.sh
          # Use autotools path: avoids meson asking for a Sphinx etc.
          ./configure \
            --prefix="${PREFIX}" \
            --sysconfdir=/etc \
            --enable-shared \
            --enable-static \
            --disable-docs \
            --disable-nls \
            --enable-libxml2 \
            CFLAGS="${CFLAGS_BASE}" \
            CPPFLAGS="-I${PREFIX}/include" \
            LDFLAGS="-L${PREFIX}/lib"
          make -j"$(nproc)"
          make install
          pkg-config --modversion fontconfig

      - name: Build harfbuzz
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/harfbuzz.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/harfbuzz.pc present"; exit 0; fi
          cd /tmp
          curl -fL "https://github.com/harfbuzz/harfbuzz/releases/download/${V_HARFBUZZ}/harfbuzz-${V_HARFBUZZ}.tar.xz" -o hb.txz
          tar xJf hb.txz
          cd harfbuzz-${V_HARFBUZZ}
          meson setup build \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=both \
            --wrap-mode=nofallback \
            -Dtests=disabled \
            -Ddocs=disabled \
            -Dintrospection=enabled \
            -Dicu=disabled \
            -Dgraphite2=disabled \
            -Dchafa=disabled \
            -Dfreetype=enabled \
            -Dglib=enabled \
            -Dgobject=enabled \
            -Dcairo=disabled \
            -Dutilities=disabled
          ninja -C build -j"$(nproc)"
          ninja -C build install
          pkg-config --modversion harfbuzz

      - name: Rebuild freetype with harfbuzz support
        run: |
          set -eux
          if [ -f "/opt/deps/.freetype-with-harfbuzz" ]; then echo "skip: marker /opt/deps/.freetype-with-harfbuzz present"; exit 0; fi
          cd /tmp/freetype-${V_FREETYPE}
          make distclean || true
          ./configure \
            --prefix="${PREFIX}" \
            --with-harfbuzz=yes \
            --with-png=yes \
            --with-zlib=yes \
            --with-bzip2=no \
            --with-brotli=no \
            CFLAGS="${CFLAGS_BASE}" \
            CPPFLAGS="-I${PREFIX}/include $(pkg-config --cflags harfbuzz)" \
            LDFLAGS="-L${PREFIX}/lib"
          make -j"$(nproc)"
          make install
          pkg-config --modversion freetype2
          touch /opt/deps/.freetype-with-harfbuzz

      - name: Build cairo (x11 + wayland, no xft)
        run: |
          set -eux
          if [ -f "/opt/deps/lib/pkgconfig/cairo-ft.pc" ]; then echo "skip: marker /opt/deps/lib/pkgconfig/cairo-ft.pc present"; exit 0; fi
          cd /tmp
          UA='Mozilla/5.0 (X11; Linux x86_64)'
          download() {
            for i in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 5 -A "$UA" "$1" -o cairo.txz; then return 0; fi
              echo "retry $i for $1"; sleep 5
            done
            return 1
          }
          download "https://cairographics.org/releases/cairo-${V_CAIRO}.tar.xz" \
          || download "https://gitlab.freedesktop.org/cairo/cairo/-/archive/${V_CAIRO}/cairo-${V_CAIRO}.tar.gz"
          # Auto-detect compression
          if file cairo.txz | grep -q 'XZ compressed'; then
            tar xJf cairo.txz
          else
            tar xzf cairo.txz
          fi
          # Gitlab archive has different dir naming
          if [ -d "cairo-${V_CAIRO}" ] && [ ! -d "cairo-${V_CAIRO}" ]; then
