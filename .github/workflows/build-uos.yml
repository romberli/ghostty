name: Build for UOS20 (glibc 2.28)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:11-slim
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
      # Lock ghostty binary to glibc 2.28 (UOS20 baseline).
      # Build host is debian:11 (glibc 2.31) but Zig provides multi-version
      # glibc headers/stubs, so the resulting binary will only reference
      # symbols present up through GLIBC_2.28.
      ZIG_TARGET: x86_64-linux-gnu.2.28
      MAX_GLIBC: "2.28"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies (system GTK4 stack)
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            ca-certificates curl wget xz-utils \
            git \
            python3 \
            patchelf file binutils \
            xxd \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtk4-layer-shell-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libbz2-dev \
            libonig-dev \
            libxml2-utils \
            blueprint-compiler \
            gettext \
            tar gzip
          rm -rf /var/lib/apt/lists/*

      - name: Show environment versions
        run: |
          set -eux
          gcc --version | head -n1
          ldd --version | head -n1
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --modversion gtk4-layer-shell-0 || true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build Ghostty (glibc 2.28 target)
        run: |
          set -eux
          zig build \
            -Doptimize=ReleaseSafe \
            -Dtarget=${ZIG_TARGET} \
            -Dcpu=x86_64_v2 \
            -Dapp-runtime=gtk \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Dpie=true
          ls -la zig-out/bin/

      - name: Inspect binary
        run: |
          set -eux
          file zig-out/bin/ghostty
          echo "--- ldd ---"
          ldd zig-out/bin/ghostty || true
          echo "--- glibc symbol versions referenced by binary ---"
          objdump -T zig-out/bin/ghostty 2>/dev/null \
            | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_/) print $i }' \
            | sort -uV || true

      - name: Verify ghostty binary itself does not reference glibc > 2.28
        run: |
          set -eux
          MAX_USED=$(
            objdump -T zig-out/bin/ghostty 2>/dev/null \
              | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_[0-9]/) print $i }' \
              | sed 's/^GLIBC_//' \
              | sort -uV \
              | tail -n1
          )
          echo "Highest GLIBC symbol referenced by ghostty: ${MAX_USED:-none}"
          if [ -z "$MAX_USED" ]; then
            echo "WARNING: no GLIBC symbol references found (very unlikely)"
            exit 0
          fi
          # Compare versions: max allowed is $MAX_GLIBC
          HIGHEST=$(printf '%s\n%s\n' "$MAX_GLIBC" "$MAX_USED" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$MAX_GLIBC" ]; then
            echo "ERROR: ghostty binary references GLIBC_${MAX_USED} > GLIBC_${MAX_GLIBC}"
            exit 1
          fi
          echo "OK: ghostty binary capped at GLIBC_${MAX_USED} <= GLIBC_${MAX_GLIBC}"

      - name: Bundle dynamic libraries (recursive ldd, exclude glibc)
        run: |
          set -eux
          OUT=dist/ghostty-uos-amd64
          mkdir -p "$OUT/lib"
          cp zig-out/bin/ghostty "$OUT/ghostty"

          # Glibc-provided libs that we must NOT bundle (they are the system contract).
          # Everything else we ship next to the binary.
          is_glibc_lib() {
            case "$1" in
              linux-vdso.so*|ld-linux-*.so*|libc.so*|libm.so*|libdl.so*|\
              libpthread.so*|libresolv.so*|librt.so*|libutil.so*|libnss_*.so*|\
              libcrypt.so*|libanl.so*|libBrokenLocale.so*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Recursive collection: BFS over dependencies.
          declare -A SEEN=()
          QUEUE=("$OUT/ghostty")

          while [ ${#QUEUE[@]} -gt 0 ]; do
            target="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")

            # Run ldd, parse "name => path" entries.
            while IFS= read -r line; do
              # Lines look like:
              #   libfoo.so.1 => /usr/lib/x86_64-linux-gnu/libfoo.so.1 (0x...)
              #   linux-vdso.so.1 (0x...)
              #   /lib64/ld-linux-x86-64.so.2 (0x...)
              name=$(echo "$line" | awk '{print $1}')
              path=$(echo "$line" | awk '{
                for (i=1;i<=NF;i++) if ($i=="=>") { print $(i+1); exit }
              }')
              [ -z "$path" ] && continue
              [ "$path" = "not" ] && continue   # "not found"
              if is_glibc_lib "$name"; then
                continue
              fi
              if [ ! -f "$path" ]; then
                continue
              fi
              real=$(readlink -f "$path")
              base=$(basename "$path")
              if [ -n "${SEEN[$base]:-}" ]; then
                continue
              fi
              SEEN[$base]=1

              # Copy the resolved real file under the symlink name.
              cp -L "$real" "$OUT/lib/$base"
              chmod u+w "$OUT/lib/$base"
              QUEUE+=("$OUT/lib/$base")
            done < <(ldd "$target" 2>/dev/null || true)
          done

          echo "--- bundled libs ---"
          ls -la "$OUT/lib/"

      - name: Patch RPATH on binary and bundled libs
        run: |
          set -eux
          OUT=dist/ghostty-uos-amd64
          patchelf --set-rpath '$ORIGIN/lib' "$OUT/ghostty"
          for so in "$OUT/lib/"*.so*; do
            [ -f "$so" ] || continue
            # Only patch ELFs (skip stray non-ELF files just in case).
            if file "$so" | grep -q ELF; then
              patchelf --set-rpath '$ORIGIN' "$so" || true
            fi
          done

      - name: Verify final bundle (no missing deps, no glibc>${{ env.MAX_GLIBC }})
        run: |
          set -euo pipefail
          OUT=dist/ghostty-uos-amd64
          cd "$OUT"

          echo "=== ldd of main binary (run from bundle dir) ==="
          ldd ./ghostty

          echo
          echo "=== Checking for 'not found' entries ==="
          if ldd ./ghostty | grep -F "not found"; then
            echo "ERROR: ghostty has unresolved dependencies"
            exit 1
          fi
          for so in lib/*.so*; do
            [ -f "$so" ] || continue
            if ldd "$so" 2>/dev/null | grep -F "not found"; then
              echo "ERROR: $so has unresolved dependencies"
              exit 1
            fi
          done
          echo "OK: no missing dependencies"

          echo
          echo "=== glibc symbol scan over bundle ==="
          MAX="${MAX_GLIBC}"
          OFFENDERS=()
          scan_one() {
            local f="$1"
            local high
            high=$(objdump -T "$f" 2>/dev/null \
              | awk '/GLIBC_/ { for(i=1;i<=NF;i++) if($i ~ /^GLIBC_[0-9]/) print $i }' \
              | sed 's/^GLIBC_//' \
              | sort -uV \
              | tail -n1)
            if [ -z "$high" ]; then
              echo "  (no GLIBC refs) $f"
              return 0
            fi
            local top
            top=$(printf '%s\n%s\n' "$MAX" "$high" | sort -V | tail -n1)
            if [ "$top" = "$MAX" ]; then
              echo "  OK   GLIBC_${high}  $f"
            else
              echo "  WARN GLIBC_${high}  $f"
              OFFENDERS+=("$f:GLIBC_${high}")
            fi
          }
          scan_one ./ghostty
          for so in lib/*.so*; do
            [ -f "$so" ] || continue
            scan_one "$so"
          done

          echo
          if [ ${#OFFENDERS[@]} -gt 0 ]; then
            echo "WARNING: ${#OFFENDERS[@]} bundled file(s) reference GLIBC > ${MAX}:"
            for o in "${OFFENDERS[@]}"; do echo "  - $o"; done
            echo
            echo "These will fail at runtime on UOS20 unless those specific"
            echo "symbols happen to not be called. Listing for triage; not"
            echo "failing the build yet."
          else
            echo "OK: every file in the bundle stays within GLIBC_${MAX}"
          fi

      - name: Create distribution tarball
        run: |
          set -eux
          cd dist
          tar czf ghostty-uos-amd64.tar.gz ghostty-uos-amd64
          ls -lh ghostty-uos-amd64.tar.gz
          echo
          echo "=== Tarball contents (top 50) ==="
          tar tzf ghostty-uos-amd64.tar.gz | head -n 50

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-uos-amd64
          path: dist/ghostty-uos-amd64.tar.gz
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "- Build host: \`debian:11-slim\` (glibc 2.31)"
            echo "- Target: \`${ZIG_TARGET}\`, max glibc \`GLIBC_${MAX_GLIBC}\`"
            echo "- App runtime: GTK4 / Wayland"
            echo
            if [ -f dist/ghostty-uos-amd64.tar.gz ]; then
              size=$(ls -lh dist/ghostty-uos-amd64.tar.gz | awk '{print $5}')
              echo "Tarball: \`ghostty-uos-amd64.tar.gz\` (${size})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
