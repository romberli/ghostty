name: Build for UOS20 (Debian 10)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      optimize_level:
        description: 'Optimization level'
        required: false
        default: '2'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'

env:
  DEPS_PREFIX: /opt/deps
  ZIG_PREFIX: /opt/zig
  PKG_CONFIG_PATH: /opt/deps/lib/pkgconfig:/usr/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/deps/lib:/usr/lib

jobs:
  build-uos:
    runs-on: ubuntu-latest
    container:
      image: debian:10
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
      PREFIX: /opt/deps
      ZIG_VERSION: 0.13.0
      OPTIMIZE_LEVEL: ${{ github.event.inputs.optimize_level || '2' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure archive sources for Debian 10
        run: |
          echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian buster-updates main" >> /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
          apt-get update

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            /opt/zig
            /opt/deps
          key: uos-deps-v2-${{ hashFiles('build.zig.zon.json') }}-${{ github.run_number }}
          restore-keys: |
            uos-deps-v2-

      - name: Install build tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            python3 python3-pip \
            git curl wget \
            pkg-config \
            autoconf automake libtool \
            patchelf \
            libexpat1-dev \
            libxml2-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            bison \
            gperf \
            xsltproc \
            nasm
          pip3 install --upgrade pip setuptools wheel
          pip3 install meson ninja

      - name: Install Zig
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          curl -L https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz \
            | tar -xJ -C /opt
          mv /opt/zig-linux-x86_64-${ZIG_VERSION} /opt/zig
          ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Build zlib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          ./configure --prefix=${PREFIX}
          make -j$(nproc)
          make install

      - name: Build libpng
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://download.sourceforge.net/libpng/libpng-1.6.40.tar.gz
          tar xf libpng-1.6.40.tar.gz
          cd libpng-1.6.40
          CPPFLAGS="-fPIC -I${PREFIX}/include" LDFLAGS="-L${PREFIX}/lib" ./configure --prefix=${PREFIX} --enable-static --disable-shared --with-zlib-prefix=${PREFIX}
          make -j$(nproc)
          make install

      - name: Build libjpeg-turbo
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/2.1.5/libjpeg-turbo-2.1.5.tar.gz
          tar xf libjpeg-turbo-2.1.5.tar.gz
          cd libjpeg-turbo-2.1.5
          CFLAGS="-fPIC" cmake -G "Unix Makefiles" -DCMAKE_INSTALL_PREFIX=${PREFIX} -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC=TRUE -DENABLE_SHARED=FALSE .
          make -j$(nproc)
          make install

      - name: Build libffi
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          ./configure --prefix=${PREFIX} CFLAGS="-fPIC" --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Build glib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://download.gnome.org/sources/glib/2.78/glib-2.78.4.tar.xz
          tar xf glib-2.78.4.tar.xz
          cd glib-2.78.4
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Dtests=false \
            -Dselinux=disabled
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build wayland
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://gitlab.freedesktop.org/wayland/wayland/-/archive/1.22.0/wayland-1.22.0.tar.gz
          tar xf wayland-1.22.0.tar.gz
          cd wayland-1.22.0
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Ddocumentation=false \
            -Ddtd_validation=false
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build wayland-protocols
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://gitlab.freedesktop.org/wayland/wayland-protocols/-/archive/1.36/wayland-protocols-1.36.tar.gz
          tar xf wayland-protocols-1.36.tar.gz
          cd wayland-protocols-1.36
          meson setup build --prefix=${PREFIX}
          ninja -C build
          ninja -C build install

      - name: Build libxkbcommon
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://xkbcommon.org/download/libxkbcommon-1.6.0.tar.xz
          tar xf libxkbcommon-1.6.0.tar.xz
          cd libxkbcommon-1.6.0
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Denable-wayland=true \
            -Denable-x11=false \
            -Denable-docs=false
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build cairo
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://cairographics.org/releases/cairo-1.18.0.tar.xz
          tar xf cairo-1.18.0.tar.xz
          cd cairo-1.18.0
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build pango
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          wget -q https://download.gnome.org/sources/pango/1.52/pango-1.52.2.tar.xz
          tar xf pango-1.52.2.tar.xz
          cd pango-1.52.2
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build gdk-pixbuf
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib"
          wget -q https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-2.42.10.tar.xz
          tar xf gdk-pixbuf-2.42.10.tar.xz
          cd gdk-pixbuf-2.42.10
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Dintrospection=disabled \
            -Dinstalled_tests=false \
            -Dgio_sniffing=false \
            -Dman=false \
            -Dgtk_doc=false \
            -Dbuiltin_loaders=png,jpeg \
            -Dpng=enabled \
            -Djpeg=enabled \
            -Dtiff=disabled
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build libepoxy
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          git clone --depth 1 --branch 1.5.10 https://github.com/anholt/libepoxy.git libepoxy-1.5.10
          cd libepoxy-1.5.10
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Dtests=false
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build graphene
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          git clone --depth 1 --branch 1.10.8 https://github.com/ebassi/graphene.git graphene-1.10.8
          cd graphene-1.10.8
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build GTK4
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib"
          wget -q https://download.gnome.org/sources/gtk/4.14/gtk-4.14.4.tar.xz
          tar xf gtk-4.14.4.tar.xz
          cd gtk-4.14.4
          rm -f subprojects/*.wrap
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            --wrap-mode=nofallback \
            -Dwayland-backend=true \
            -Dx11-backend=false \
            -Dbuild-demos=false \
            -Dbuild-tests=false \
            -Dbuild-testsuite=false \
            -Dintrospection=disabled \
            -Dvulkan=disabled \
            -Dmedia-gstreamer=disabled \
            -Dprint-backends=file \
            -Dbuild-examples=false
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build gtk4-layer-shell
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PATH="${PREFIX}/bin:${PATH}"
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib"
          git clone --depth 1 --branch v1.0.3 https://github.com/nicehash/gtk4-layer-shell.git gtk4-layer-shell-1.0.3
          cd gtk4-layer-shell-1.0.3
          meson setup build \
            --prefix=${PREFIX} \
            --libdir=lib \
            --default-library=static \
            -Dtests=false \
            -Dexamples=false
          ninja -C build -j$(nproc)
          ninja -C build install

      - name: Build Ghostty
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib"
          export PATH="${ZIG_PREFIX}:${PREFIX}/bin:${PATH}"
          
          # Force static linking of dependencies
          zig build \
            -Doptimize=ReleaseSafe \
            -Dtarget=x86_64-linux-gnu.2.28 \
            -Dcpu=x86_64_v2 \
            --search-prefix ${PREFIX} \
            --search-prefix /usr \
            -Dapp-runtime=gtk \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Dpie=false
          
          ls -la zig-out/bin/
          
          echo "Checking binary dependencies:"
          ldd zig-out/bin/ghostty || true
          
          echo "Binary size:"
          ls -lh zig-out/bin/ghostty

      - name: Prepare minimal portable bundle
        run: |
          mkdir -p dist/ghostty-uos-amd64
          
          BINARY=zig-out/bin/ghostty
          
          # Copy the binary (should be mostly statically linked)
          cp "$BINARY" dist/ghostty-uos-amd64/
          
          echo "Analyzing remaining dependencies..."
          ldd "$BINARY" 2>/dev/null || echo "Binary may be statically linked"
          
          # Check what's actually needed
          DEPS=$(ldd "$BINARY" 2>/dev/null | grep "not found" || true)
          if [ -n "$DEPS" ]; then
            echo "WARNING: Missing dependencies detected:"
            echo "$DEPS"
          fi
          
          # Show final binary info
          ls -lh dist/ghostty-uos-amd64/ghostty
          
          file dist/ghostty-uos-amd64/ghostty

      - name: Create distribution package
        run: |
          cd dist
          tar czf ghostty-uos-amd64.tar.gz ghostty-uos-amd64
          
          # Show package contents
          tar tzf ghostty-uos-amd64.tar.gz
          
          # Show package size
          ls -lh ghostty-uos-amd64.tar.gz
          
          echo ""
          echo "IMPORTANT: This package requires minimal system dependencies:"
          echo "  - glibc 2.28+ (included in UOS20)"
          echo "  - libwayland-client (if using Wayland)"
          echo "  - libxkbcommon (for keyboard handling)"
          echo "  - Basic OpenGL/Mesa libraries"
          echo ""
          echo "All other dependencies (GTK4, glib, pango, etc.) are statically linked."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-uos-amd64
          path: dist/ghostty-uos-amd64.tar.gz
          retention-days: 90

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Built Ghostty for UOS20 (Debian 10) with static linking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package size:** $(ls -lh dist/ghostty-uos-amd64.tar.gz | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target glibc:** 2.28" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**System Requirements on UOS20:**" >> $GITHUB_STEP_SUMMARY
          echo "- glibc 2.28+ (standard on UOS20)" >> $GITHUB_STEP_SUMMARY
          echo "- libwayland-client (if using Wayland)" >> $GITHUB_STEP_SUMMARY
          echo "- libxkbcommon (keyboard handling)" >> $GITHUB_STEP_SUMMARY
          echo "- OpenGL/Mesa libraries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bundled Dependencies (statically linked):**" >> $GITHUB_STEP_SUMMARY
          echo "- GTK4, glib, pango, cairo, gdk-pixbuf" >> $GITHUB_STEP_SUMMARY
          echo "- libepoxy, graphene, libxkbcommon" >> $GITHUB_STEP_SUMMARY
          echo "- wayland protocols" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`ghostty-uos-amd64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract to any directory" >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`./ghostty\` directly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Minimal system dependencies required (see above)" >> $GITHUB_STEP_SUMMARY