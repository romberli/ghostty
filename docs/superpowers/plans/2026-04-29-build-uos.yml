## Task 3: Create build-uos.yml Workflow File (Part 2 - Job Definition)

**Files:**
- Modify: `.github/workflows/build-uos.yml` (append job definition)

- [ ] **Step 1: Add job definition with container and steps structure**

```yaml
  build-uos:
    runs-on: ubuntu-latest
    container:
      image: debian:10
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
      PREFIX: /opt/deps
      ZIG_VERSION: 0.13.0
      OPTIMIZE_LEVEL: ${{ github.event.inputs.optimize_level || '2' }}

    steps:
```

