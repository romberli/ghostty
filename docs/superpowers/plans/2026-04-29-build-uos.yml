## Task 2: Create build-uos.yml Workflow File (Part 1 - Header and Triggers)

**Files:**
- Create: `.github/workflows/build-uos.yml`

- [ ] **Step 1: Write workflow header with name and triggers**

```yaml
name: Build for UOS20 (Debian 10)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      optimize_level:
        description: 'Optimization level'
        required: false
        default: '2'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'

env:
  DEPS_PREFIX: /opt/deps
  ZIG_PREFIX: /opt/zig
  PKG_CONFIG_PATH: /opt/deps/lib/pkgconfig:/usr/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/deps/lib:/usr/lib

jobs:
```

