## Task 20: Add Library Collection Step

**Files:**
- Modify: `.github/workflows/build-uos.yml` (append library collection step)

- [ ] **Step 1: Add step to collect required shared libraries**

```yaml
      - name: Collect required libraries
        run: |
          mkdir -p dist/ghostty-uos-amd64/lib
          
          # Find all dynamic libraries needed by ghostty from our deps
          ldd zig-out/bin/ghostty 2>/dev/null | \
            grep -E "=> ${PREFIX}" | \
            awk '{print $3}' | \
            while read lib; do
              cp -L "$lib" dist/ghostty-uos-amd64/lib/ 2>/dev/null || true
            done
          
          # Copy the binary
          cp zig-out/bin/ghostty dist/ghostty-uos-amd64/
          
          # List collected libraries
          ls -la dist/ghostty-uos-amd64/lib/
```

