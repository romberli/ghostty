# Build UOS Compatible Version Implementation Plan

> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.

**Goal:** Create GitHub Action workflow to build Ghostty for UOS20 (Debian 10 based) with all dependencies bundled

**Architecture:** Multi-stage build with caching - build all GTK4 dependencies from source in Debian 10 container, use GitHub Actions cache to avoid rebuilding, bundle all shared libraries with the executable using RPATH=$ORIGIN/lib

**Tech Stack:** GitHub Actions, Debian 10 container, Zig 0.13, Meson, Ninja, GTK4 from source

