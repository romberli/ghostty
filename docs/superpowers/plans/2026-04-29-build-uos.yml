## Task 19: Add Ghostty Build Step

**Files:**
- Modify: `.github/workflows/build-uos.yml` (append Ghostty build step)

- [ ] **Step 1: Add Ghostty compilation step**

```yaml
      - name: Build Ghostty
        run: |
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:/usr/lib/pkgconfig"
          export LD_LIBRARY_PATH="${PREFIX}/lib:/usr/lib"
          export PATH="${ZIG_PREFIX}:${PATH}"
          
          zig build \
            -Doptimize=ReleaseSafe \
            -Dtarget=x86_64-linux-gnu.2.28 \
            -Dcpu=x86_64_v2 \
            --search-prefix ${PREFIX} \
            --search-prefix /usr \
            -Dgtk=true \
            -Dwayland=true \
            -Dbackend=gtk
          
          ls -la zig-out/bin/
```

